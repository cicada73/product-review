{% extends "accounts/base.html" %}

{% block title %}Password reset complete · Product Reviews{% endblock %}

{% block content %}

    <h1 id="account-title">Password reset complete</h1>

    <p class="auth-intro">

    <div class="auth-links">
        <a class="auth-back" href="{% url 'home' %}">
            Back to home
        </a>
    </div>
{% endblock %}
