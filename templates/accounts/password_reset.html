{% extends "accounts/base.html" %}

{% block title %}Reset password{% endblock %}

{% block content %}
    <h1 id="account-title">Reset your password</h1>

    <p>Enter your account email to request a password-reset link.</p>

    <form method="post" action="{% url 'accounts:password_reset' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Request reset link</button>
    </form>

    <p><a href="{% url 'accounts:login' %}">Back to login</a></p>
{% endblock %}
