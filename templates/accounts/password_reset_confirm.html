{% extends "accounts/base.html" %}

{% block title %}Choose a new password{% endblock %}

{% block content %}
    <h1 id="account-title">Choose a new password</h1>

    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Reset password</button>
        </form>
    {% else %}
        <p>This reset link is invalid or has expired.</p>

        <a class="button" href="{% url 'accounts:password_reset' %}">
            Request a new link
        </a>
    {% endif %}
{% endblock %}
