{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | Product Reviews</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header>
        <a class="brand" href="{% url 'home' %}">Product Reviews</a>
    </header>

    <main>
        <section class="auth-card" aria-labelledby="password-title">
            <h1 id="password-title">Change password</h1>

            <p>Enter your current password and choose a new one.</p>

            <form
                method="post"
                action="{% url 'accounts:password_change' %}"
            >
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change password</button>
            </form>

            <p>
                <a href="{% url 'accounts:profile' %}">
                    Back to profile
                </a>
            </p>
        </section>
    </main>
</body>
</html>
