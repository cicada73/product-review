name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: product_reviews
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_SECRET_KEY: ci-only-key-for-disposable-tests-never-use-in-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      MYSQL_DATABASE: product_reviews
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install MySQL driver build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium

      - name: Check Django configuration
        run: python manage.py check --database default

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run application and browser tests against MySQL
        run: python manage.py test --noinput --verbosity 2